services:
  gpu-specialist:
    image: ${GPU_IMAGE:-ghcr.io/ggml-org/llama.cpp@sha256:2e323f437c6169a94f9edf5f8b8cf2fca8c70104e4196effa3a3d58f03eefb40}
    restart: "no"
    command:
      - -m
      - /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      - --alias
      - atlas-specialist
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
    volumes:
      - ./infra/brev/model-cache:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gpu-probe:
    image: curlimages/curl@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
    profiles: [tools]
    entrypoint: [curl]
    volumes:
      - ./infra/brev/evidence:/probe
    depends_on:
      - gpu-specialist
